<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample Galleries | Aftershoot Galleries</title>
  <meta name="description" content="Delivery galleries photographers and clients actually get excited about. Peek at a few, sorted by genre." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface-1: #ffffff;
      --type-1: #474747;
      --type-2: #71717a;
      --tab-inactive: #919191;
      --tab-edge: #27272a;
      --edge-5: #e2e2e2;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary-bg: rgba(37, 99, 235, 0.12);
      --secondary-bg-hover: rgba(37, 99, 235, 0.18);
      --radius-card: 16px;
      --page-max: 1262px;

      --gutter: 60px;
      --hero-py: 40px;
      --grid-gap: 40px;
      --grid-cols: 3;
      /* 551×659 card minus 16px gap + 42px meta → image ≈ 354×365 at 1262 wide */
      --cover-ratio: 354 / 365;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--surface-1);
      color: var(--type-1);
      font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img, video { display: block; max-width: 100%; }

    .container { width: 100%; max-width: var(--page-max); margin: 0 auto; }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface-1);
    }
    .site-header .container {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px var(--gutter);
    }
    .logo { position: relative; width: 137px; height: 32px; flex-shrink: 0; }
    .logo img { position: absolute; }
    .logo .logo-mark { top: 17.39%; bottom: 17.39%; left: 6.6%; right: 77.16%; width: 22.254px; height: 20.87px; }
    .logo .logo-word { top: 28.26%; bottom: 28.26%; left: 28.93%; right: 8.12%; width: 86.2335px; height: 13.913px; }

    .tabs { display: flex; gap: 12px; align-items: center; }
    .tab {
      padding: 6px 4px;
      border-bottom: 1px solid transparent;
      font-size: 11px; line-height: 12px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
      color: var(--tab-inactive);
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--type-1); }
    .tab[aria-current="true"] { color: var(--type-1); border-bottom-color: var(--tab-edge); }
    .tabs-mobile { display: none; }

    /* ---------- Hero ---------- */
    .hero .container {
      display: flex; align-items: center; gap: 20px;
      padding: var(--hero-py) var(--gutter);
    }
    .hero-copy {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; justify-content: flex-end; gap: 36px;
    }
    .hero-text { display: flex; flex-direction: column; gap: 16px; }
    .hero h1 {
      margin: 0; font-weight: 500; font-size: 48px; line-height: 56px; color: var(--type-1);
    }
    .hero-sub {
      margin: 0; font-weight: 500; font-size: 20px; line-height: 24px; color: var(--type-2);
      max-width: 34em;
    }
    .hero-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; padding: 10px 20px; border-radius: 9999px; border: 1px solid transparent;
      font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap;
      transition: background-color .15s;
    }
    .btn-secondary { background: var(--secondary-bg); color: var(--primary); }
    .btn-secondary:hover { background: var(--secondary-bg-hover); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn:focus-visible, .tab:focus-visible, .card:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

    .hero-media { flex: 1 1 0; min-width: 0; }
    .hero-media video { width: 100%; aspect-ratio: 723.5 / 722; object-fit: cover; background: #f4f4f5; }

    /* ---------- Sections ---------- */
    .section-header .container {
      display: flex; flex-direction: column; gap: 6px;
      padding: 20px var(--gutter);
    }
    .section-titles { display: flex; flex-direction: column; gap: 6px; }
    .section-index { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--type-2); }
    .section-header h2 { margin: 0; font-size: 30px; line-height: 32px; font-weight: 500; color: var(--type-1); }
    .section-desc { margin: 0; font-size: 16px; line-height: 20px; color: var(--type-1); }

    .gallery-row { border-bottom: 1px solid var(--edge-5); }
    section:last-of-type .gallery-row { border-bottom: 0; }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      gap: var(--grid-gap);
      padding: 40px var(--gutter);
    }

    .card { display: flex; flex-direction: column; gap: 16px; border-radius: var(--radius-card); }
    .card-cover {
      position: relative; overflow: hidden; border-radius: var(--radius-card);
      aspect-ratio: var(--cover-ratio); background: #f4f4f5;
    }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
    .card:hover .card-cover img { transform: scale(1.04); }
    .card-cover::after {
      content: "View gallery ↗";
      position: absolute; right: 12px; bottom: 12px;
      padding: 6px 12px; border-radius: 9999px;
      background: rgba(255,255,255,.92); color: var(--type-1);
      font-size: 12px; line-height: 16px; font-weight: 500;
      opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s;
    }
    .card:hover .card-cover::after, .card:focus-visible .card-cover::after { opacity: 1; transform: none; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-meta-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .card-name { font-size: 16px; line-height: 20px; color: var(--type-1); }
    .card-by, .card-extra {
      font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--type-2);
    }
    .card-extra { text-align: right; white-space: nowrap; display: none; }

    /* ---------- Tablet ---------- */
    @media (max-width: 1023px) {
      :root { --gutter: 32px; --grid-gap: 24px; --grid-cols: 2; }
      .hero h1 { font-size: 40px; line-height: 48px; }
      .hero-sub { font-size: 18px; line-height: 24px; }
    }

    /* ---------- Phone ---------- */
    @media (max-width: 767px) {
      :root { --gutter: 16px; --grid-gap: 24px; --grid-cols: 1; --cover-ratio: 343 / 393; }

      .site-header { position: static; }
      .site-header .container { justify-content: center; padding: 16px 16px 20px; }
      .site-header .tabs { display: none; }

      .hero .container { flex-direction: column; align-items: stretch; gap: 20px; padding: 24px 16px; }
      .hero-media { order: -1; }
      .hero-copy { gap: 16px; }
      .hero h1 { font-size: 30px; line-height: 32px; }
      .hero-sub { font-size: 14px; line-height: 20px; font-weight: 400; }
      .hero-actions { flex-direction: column; align-items: stretch; }
      .hero-actions .btn { width: 100%; }

      .tabs-mobile {
        display: block; position: sticky; top: 0; z-index: 10;
        background: var(--surface-1);
      }
      .tabs-mobile .tabs { padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
      .tabs-mobile .tabs::-webkit-scrollbar { display: none; }

      .section-header .container { gap: 12px; padding: 16px; }
      .gallery-grid { padding: 16px; }
      .card-extra { display: block; }
    }

    section[id] { scroll-margin-top: 72px; }
    @media (max-width: 767px) { section[id] { scroll-margin-top: 44px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="https://aftershoot.com" target="_blank" rel="noopener" aria-label="Aftershoot">
        <img class="logo-mark" src="assets/logo-mark.png" width="22.254" height="20.87" alt="" />
        <img class="logo-word" src="assets/logo-wordmark.svg" width="86.2335" height="13.913" alt="" />
      </a>
      <nav class="tabs" aria-label="Genres" data-tabs></nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-copy">
          <div class="hero-text">
            <h1>Your photos deserve<br />a big entrance.</h1>
            <p class="hero-sub">Delivery galleries photographers and clients actually get excited about. Peek at a few, sorted by genre.</p>
          </div>
          <div class="hero-actions">
            <a class="btn btn-secondary" href="#weddings">Explore Samples</a>
            <a class="btn btn-primary" href="https://aftershoot.com" target="_blank" rel="noopener">Create Your Gallery</a>
          </div>
        </div>
        <div class="hero-media">
          <video src="assets/hero.mp4" poster="assets/hero-poster.jpg" autoplay muted loop playsinline preload="auto" aria-label="Aftershoot Galleries cover, grid and store features"></video>
        </div>
      </div>
    </section>

    <div class="tabs-mobile">
      <nav class="tabs" aria-label="Genres" data-tabs></nav>
    </div>

    <div id="sections"></div>
  </main>

  <script>
    const BASE = "https://aftershootgalleriesstudio.gallery.aftershoot.com/";

    const GENRES = [
      {
        id: "weddings",
        title: "Weddings",
        desc: "Timeless days, delivered with the care they deserve",
        galleries: [
          { name: "Forever Begins Here", by: "Wedding", extra: "Vineyard", slug: "forever-begins-here", cover: "assets/cover-forever-begins-here.jpg" },
          { name: "Savannah & Sean", by: "Wedding", extra: "Sneak peeks", slug: "wedding-gallery", cover: "assets/cover-savannah-sean.jpg" },
          { name: "Kaiya & Drew", by: "Engagement", extra: "Film", slug: "gallery", cover: "assets/cover-kaiya-drew.jpg" },
        ],
      },
      {
        id: "portraits",
        title: "Portraits",
        desc: "Quite considered portraits and personal branding",
        galleries: [
          { name: "Portrait Sample Gallery", by: "Portrait session", extra: "Portrait", slug: "portrait-sample-gallery", cover: "assets/cover-portrait-sample.jpg" },
          { name: "SWEL Headshots", by: "Headshot happy hours", extra: "Branding", slug: "savannah-sean", cover: "assets/cover-swel.jpg" },
        ],
      },
    ];

    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    document.getElementById("sections").innerHTML = GENRES.map((g, i) => `
      <section id="${g.id}" aria-labelledby="${g.id}-title">
        <div class="section-header">
          <div class="container">
            <div class="section-titles">
              <span class="section-index">${String(i + 1).padStart(2, "0")}</span>
              <h2 id="${g.id}-title">${esc(g.title)}</h2>
            </div>
            <p class="section-desc">${esc(g.desc)}</p>
          </div>
        </div>
        <div class="gallery-row">
          <div class="container gallery-grid">
            ${g.galleries.map((c) => `
              <a class="card" href="${BASE}${c.slug}" target="_blank" rel="noopener" aria-label="Open ${esc(c.name)} gallery in a new tab">
                <div class="card-cover"><img src="${c.cover}" alt="${esc(c.name)} cover" loading="lazy" /></div>
                <div class="card-meta">
                  <div class="card-meta-left">
                    <span class="card-name">${esc(c.name)}</span>
                    <span class="card-by">${esc(c.by)}</span>
                  </div>
                  <span class="card-extra">${esc(c.extra)}</span>
                </div>
              </a>`).join("")}
          </div>
        </div>
      </section>`).join("");

    const tabNavs = document.querySelectorAll("[data-tabs]");
    tabNavs.forEach((nav) => {
      nav.innerHTML = GENRES.map((g) => `<a class="tab" href="#${g.id}">${esc(g.title)}</a>`).join("");
    });

    const setActive = (id) => {
      document.querySelectorAll(".tab").forEach((t) => {
        t.setAttribute("aria-current", t.getAttribute("href") === "#" + id ? "true" : "false");
      });
    };
    setActive(GENRES[0].id);

    // Highlight the tab of whichever genre section is under the top of the viewport.
    const sections = GENRES.map((g) => document.getElementById(g.id));
    const onScroll = () => {
      const line = window.innerHeight * 0.35;
      let current = GENRES[0].id;
      for (const s of sections) if (s.getBoundingClientRect().top <= line) current = s.id;
      setActive(current);
    };
    window.addEventListener("scroll", onScroll, { passive: true });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelector(".hero-media video").pause();
    }
  </script>
</body>
</html>
